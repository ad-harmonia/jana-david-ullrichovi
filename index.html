<style>
:root{
  --olive:#67612C;--cream:#F7F0E6;--neon:#E36128;--rt:2.2485;--rp:9.0090;
  --gold:linear-gradient(115deg,#8f7c58 0%,#d8c8a4 18%,#fbf1da 30%,#c9b48b 44%,#8f7c58 58%,#e6d6b2 74%,#a89168 88%,#8f7c58 100%);
  --r:3.3435;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;color:var(--cream);overflow-x:hidden;
  background:radial-gradient(60% 40% at 50% 0%,rgba(227,97,40,.22),transparent 70%),radial-gradient(70% 50% at 50% 100%,rgba(227,97,40,.16),transparent 70%),#1b1a0b;
  display:flex;justify-content:center;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
/* rám */
.frame{width:min(100%,440px);height:min(100%,860px);padding:2px;border-radius:30px;background:var(--gold);background-size:300% 100%;animation:sh 7s linear infinite;
  box-shadow:0 1px 0 #e9dcc0,0 3px 0 #9b8761,0 6px 0 #6d5d3f,0 9px 0 #4a3f2a,0 14px 22px rgba(0,0,0,.55),0 0 38px rgba(227,97,40,.38),0 0 90px rgba(227,97,40,.16)}
.card{height:100%;border-radius:28px;container-type:inline-size;padding:clamp(10px,2.4dvh,22px) clamp(14px,4vw,24px);display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow:auto;
  background:radial-gradient(90% 55% at 50% 12%,rgba(247,240,230,.10),transparent 70%),linear-gradient(170deg,#3d3a17,#262410 70%,#1f1d0d);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6),inset 0 -2px 0 rgba(247,240,230,.12),inset 0 0 28px rgba(227,97,40,.14)}
/* 3D */
.stage{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.5dvh,12px);padding-top:calc(clamp(10px,4.2dvh,36px) + 11px);flex:0 0 auto}
.pp{perspective:800px}
.lw{width:min(94%,calc(15dvh*var(--r)))}
.txtw{width:min(96%,calc(13.5dvh*var(--rt)))}
.pict{width:100%;flex:1 1 0;min-height:40px;display:flex;align-items:center;justify-content:center}
.pict .d3{width:92%}
.d3{position:relative;width:100%;aspect-ratio:var(--ar);transform-style:preserve-3d;transform:rotateX(calc(var(--rx,0deg)*var(--m,1))) rotateY(calc(var(--ry,0deg)*var(--m,1)));transition:transform .12s ease-out}
#logo{cursor:grab;touch-action:pan-y}
.d3 i{position:absolute;inset:0;-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat}
.d3 .ex{background:hsl(40 28% calc(52% - var(--k)*34%))}
.d3 .ed{background:#fff3d6}
.d3 .fr{background:var(--gold);background-size:300% 100%;animation:sh 5s linear infinite}
.d3 .sh{background:#000;opacity:.5;filter:blur(5px)}
#txt{transform:none}
#txt .ex,#txt .ed,#txt .sh{display:none}
#txt{transform:none!important}
#txt .ex,#txt .ed,#txt .sh{display:none}
#txt .fr{background:#F7F0E6;animation:none}
.txtw{margin-top:clamp(4px,1.3dvh,12px)}
.txtw{margin-top:clamp(5px,1.6dvh,12px)}
.nz{flex:1 1 0;min-height:26px;width:100%;display:flex;align-items:center;justify-content:center}
.neon{width:min(94%,calc(15dvh*var(--r)));height:4px;border-radius:4px;background:var(--gold);background-size:300% 100%;animation:sh 6s linear infinite;box-shadow:0 1px 0 #efe3c8,0 2px 0 #a08c66,0 3px 0 #75654a,0 4px 0 #4d412c,0 7px 8px rgba(0,0,0,.5)}
/* кнопки */
.grid{width:calc(100% - 10px);display:grid;grid-template-columns:1fr;gap:calc(clamp(6px,1.2dvh,11px) + 6px);flex:0 0 auto}
.btn{--h:clamp(38px,5.7dvh,52px);display:block;text-decoration:none;color:inherit;border:0;font:inherit;cursor:pointer;width:100%;height:var(--h);padding:2px;border-radius:17px;
  background:var(--gold);background-size:300% 100%;animation:sh 6s linear infinite;
  box-shadow:0 1px 0 #efe3c8,0 2px 0 #a08c66,0 3px 0 #75654a,0 4px 0 #4d412c,0 8px 10px rgba(0,0,0,.5);
  transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08);box-shadow:0 1px 0 #efe3c8,0 2px 0 #a08c66,0 3px 0 #75654a,0 4px 0 #4d412c,0 8px 10px rgba(0,0,0,.5),0 0 16px rgba(227,97,40,.7)}
.btn:active,.btn.p{transform:translateY(4px);box-shadow:0 1px 0 #efe3c8,0 2px 0 #4d412c,0 3px 5px rgba(0,0,0,.6),0 0 22px rgba(227,97,40,.85)}
.face{height:100%;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:1.8cqw;padding:0 1.5cqw;
  background:linear-gradient(180deg,#746d33,var(--olive) 45%,#575126);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.5),inset 0 -1px 0 rgba(247,240,230,.22),inset 0 0 14px rgba(0,0,0,.25)}
.t,.ic{background:var(--gold);background-size:300% 100%;animation:sh 6s linear infinite}
.t{-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;font-size:clamp(12px,5.2cqw,21px);letter-spacing:.03em;white-space:nowrap;text-shadow:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.ic{width:clamp(17px,6.4cqw,26px);aspect-ratio:1;flex:none;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
/* order */
.orderw{width:100%;display:flex;justify-content:center;padding-bottom:clamp(2px,.8dvh,8px);flex:0 0 auto}
.order{--h:clamp(42px,6.4dvh,62px);width:calc(74% - 19px);margin-top:clamp(4px,1.6dvh,16px);border-radius:17px}
.order .face{border-radius:13px;gap:2.4cqw;padding:0 2cqw}
.order .ic{width:clamp(20px,7.4cqw,34px)}
.order .tx{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.order .a{font-size:clamp(11px,4.6cqw,19px);letter-spacing:.5em;margin-right:-.5em}
.order .b{font-size:clamp(6.5px,2.75cqw,11px);letter-spacing:.04em}
/* modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,4,.8);backdrop-filter:blur(6px);z-index:9;padding:14px}
.modal.on{display:flex}
.mbox{width:min(100%,520px);height:min(86dvh,720px);padding:3px;border-radius:24px;background:var(--gold);background-size:300% 100%;animation:sh 6s linear infinite;box-shadow:0 0 40px rgba(227,97,40,.45),0 12px 30px #000;display:flex}
.minner{flex:1;border-radius:21px;background:#262410;overflow:hidden;display:flex;flex-direction:column}
.minner iframe{flex:1;border:0;width:100%;background:#fff}
.msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;color:var(--cream)}
.x{position:absolute;top:max(18px,env(safe-area-inset-top));right:18px;width:44px;height:44px;padding:3px;border-radius:50%}
.x .face{border-radius:50%;padding:0}
@keyframes sh{to{background-position:-300% 0}}
@keyframes pulse{50%{opacity:.7;box-shadow:0 0 4px var(--neon),0 0 10px var(--neon),0 0 20px rgba(227,97,40,.6)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

const set=(x,y)=>{R.style.setProperty("--rx",x+"deg");R.style.setProperty("--ry",y+"deg")};
const clamp=(v,m)=>Math.max(-m,Math.min(m,v));
const move=(cx,cy)=>{const r=L.getBoundingClientRect();idle=false;set(clamp(-(cy-(r.top+r.height/2))/10,32),clamp((cx-(r.left+r.width/2))/8,38))};
addEventListener("pointermove",e=>{if(e.pointerType==="mouse"||drag)move(e.clientX,e.clientY)});
L.addEventListener("pointerdown",e=>{drag=true;move(e.clientX,e.clientY)});
addEventListener("pointerup",()=>{drag=false;setTimeout(()=>idle=true,1800)});
addEventListener("deviceorientation",e=>{if(e.gamma==null||drag)return;idle=false;set(clamp((e.beta-50)/2.2,30),clamp(e.gamma/1.6,38));clearTimeout(window._io);window._io=setTimeout(()=>idle=true,2500)});
addEventListener("click",()=>{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().catch(()=>{})}},{once:true});
(function loop(t){if(idle){const s=(t-t0)/1000;set((Math.sin(s*.9)*7).toFixed(2),(Math.sin(s*.6)*20).toFixed(2))}requestAnimationFrame(loop)})(t0);
/* tlačítka – stisknutí */
document.querySelectorAll(".btn").forEach(b=>{b.addEventListener("pointerdown",()=>b.classList.add("p"));["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove("p")))});
/* vCard */
document.getElementById("vcf").onclick=()=>{
  const v=["BEGIN:VCARD","VERSION:3.0","N:Ullrichovi;Jana a David;;;","FN:"+CONTACT.name,"ORG:"+CONTACT.org,"TEL;TYPE=CELL:"+CONTACT.tel,"URL:"+CONTACT.url,"END:VCARD"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download="Ad-Harmonia.vcf";document.body.appendChild(a);a.click();a.remove();
};
/* modal – online rezervace */
const M=document.getElementById("modal"),B=document.getElementById("mbody");
document.getElementById("book").onclick=()=>{
  B.innerHTML="";
  if(BOOKING_URL){const f=document.createElement("iframe");f.src=BOOKING_URL;f.title="Online rezervace";f.loading="lazy";B.appendChild(f)}
  else B.innerHTML="<div class='msg'>Online rezervační kalendář bude brzy k dispozici.</div>";
  M.classList.add("on");
};
const cl=()=>{M.classList.remove("on");B.innerHTML=""};
document.getElementById("close").onclick=cl;
M.addEventListener("click",e=>{if(e.target===M)cl()});
addEventListener("keydown",e=>{if(e.key==="Escape")cl()});
</script>
</body>
</html>
